<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Daily Feynman Puzzle</title>
    <meta name="description" content="A daily Feynman diagram puzzle: fill in the missing particles using conservation laws and Standard Model vertex rules." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14131a" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Daily Feynman Puzzle" />
    <meta property="og:description" content="Fill in the missing particles on a Feynman diagram. A new puzzle every day." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // apply the saved theme before first paint (avoids a flash of the wrong theme)
      try {
        var t = localStorage.getItem('fdp:v1:theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>This puzzle needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
